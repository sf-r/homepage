<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saffron</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/player.css">
</head>
<body>

<header class="site-header">
  <ul id="genre-left" class="genre-nav"></ul>
  <a href="index.html" class="wordmark">Saffron</a>
  <ul id="genre-right" class="genre-nav right"></ul>
  <button id="safe-toggle" class="safe-toggle" data-safe="on">
    <span class="dot"></span>
    <span class="label">Safe ON</span>
  </button>
</header>

<main id="shelf-room" class="shelf-room" data-safe="on">
  <div class="shelf-intro">
    <h1>서재에 오신 걸 환영해요</h1>
    <p>책을 눌러 펼쳐 보세요. 오른쪽 Safe 스위치를 끄면 조명이 바뀌고, 가려져 있던 책들도 꺼낼 수 있어요.</p>
  </div>

  <div class="shelf-stage">
    <div class="corner-lamp left" aria-hidden="true">
      <svg viewBox="0 0 70 50">
        <line x1="4" y1="4" x2="24" y2="10" class="lamp-arm" />
        <path d="M24 4 L46 10 L40 23 L18 17 Z" class="lamp-housing" />
        <circle cx="42" cy="16" r="6" class="lamp-bulb" />
      </svg>
    </div>
    <div class="corner-lamp right" aria-hidden="true">
      <svg viewBox="0 0 70 50">
        <line x1="4" y1="4" x2="24" y2="10" class="lamp-arm" />
        <path d="M24 4 L46 10 L40 23 L18 17 Z" class="lamp-housing" />
        <circle cx="42" cy="16" r="6" class="lamp-bulb" />
      </svg>
    </div>
    <div class="beam beam-left" aria-hidden="true"></div>
    <div class="beam-center" aria-hidden="true"></div>
    <div class="beam beam-right" aria-hidden="true"></div>

    <div id="shelf-rows"></div>
  </div>
</main>

<div id="spread-overlay" class="spread-overlay">
  <button class="backdrop-close" aria-label="닫기"></button>
  <div class="book-spread">
    <button id="spread-close" class="spread-close" aria-label="닫기">&times;</button>
    <div class="spread-page left">
      <h2 class="spread-title"></h2>
    </div>
    <div class="spread-page right">
      <img class="spread-cover" src="" alt="">
      <p class="spread-desc"></p>
      <a class="detail-link" href="#">상세정보로 이동</a>
    </div>
  </div>
</div>

<div id="music-player" class="music-player">
  <button id="player-toggle" class="player-toggle" aria-label="재생 또는 일시정지">
    <span class="icon">▶</span>
  </button>
  <div class="player-info">
    <span id="player-track-title" class="track-title"><span class="track-title-text">재생목록에서 곡을 선택하세요</span></span>
  </div>
  <button id="mute-toggle" class="mute-toggle muted" aria-label="소리 켜기/끄기" aria-pressed="true">
    <svg class="icon-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a9 9 0 0 1 0 12"/></svg>
    <svg class="icon-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><line x1="16" y1="9" x2="22" y2="15"/><line x1="22" y1="9" x2="16" y2="15"/></svg>
  </button>
  <button id="playlist-toggle" class="playlist-toggle" aria-label="재생목록 열기">♫</button>
  <div id="playlist-panel" class="playlist-panel">
    <div class="volume-row">
      <input id="volume-slider" type="range" min="0" max="100" value="70" aria-label="음량 조절">
    </div>
    <ul id="playlist-list"></ul>
  </div>
  <audio id="audio-el" preload="none"></audio>
</div>

<script type="module" src="js/main.js"></script>
<script type="module">
  import { initMusicPlayer } from "./js/music-player.js";
  import { TRACKS } from "./js/music-data.js";
  initMusicPlayer(TRACKS);
</script>
</body>
</html>
