<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660">
  <!-- 다섯 마법숙녀의 색을 한 꽃. 가운데는 세계가 끝날 때마다 나타나는 하얀 빛. rebloom-theme.css의 .sky-rift가 사용 -->
  <defs>
    <linearGradient id="p0" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#8e9ab8" stop-opacity=".25"/><stop offset=".55" stop-color="#c9d3e6" stop-opacity=".85"/><stop offset="1" stop-color="#ffffff" stop-opacity=".95"/></linearGradient><linearGradient id="p1" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#7d5bd6" stop-opacity=".25"/><stop offset=".55" stop-color="#cdb6ff" stop-opacity=".85"/><stop offset="1" stop-color="#ffffff" stop-opacity=".95"/></linearGradient><linearGradient id="p2" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#8c7a52" stop-opacity=".25"/><stop offset=".55" stop-color="#efe4c6" stop-opacity=".85"/><stop offset="1" stop-color="#ffffff" stop-opacity=".95"/></linearGradient><linearGradient id="p3" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#1f8f86" stop-opacity=".25"/><stop offset=".55" stop-color="#7fe6d8" stop-opacity=".85"/><stop offset="1" stop-color="#ffffff" stop-opacity=".95"/></linearGradient><linearGradient id="p4" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#3a3340" stop-opacity=".25"/><stop offset=".55" stop-color="#ffffff" stop-opacity=".85"/><stop offset="1" stop-color="#ffffff" stop-opacity=".95"/></linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffe6f6" stop-opacity=".55"/>
      <stop offset=".4" stop-color="#f2a7d8" stop-opacity=".18"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".45" stop-color="#fff3fa" stop-opacity=".9"/>
      <stop offset="1" stop-color="#f2a7d8" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <ellipse cx="500" cy="330" rx="470" ry="320" fill="url(#halo)"/>
  <path d="M0,0 C-70,-60 -78,-170 0,-235 C78,-170 70,-60 0,0 Z" fill="url(#p0)" stroke="#c9d3e6" stroke-opacity=".8" stroke-width="2" transform="translate(500,330) rotate(0)" filter="url(#glow)"/><path d="M0,0 C-70,-60 -78,-170 0,-235 C78,-170 70,-60 0,0 Z" fill="url(#p1)" stroke="#cdb6ff" stroke-opacity=".8" stroke-width="2" transform="translate(500,330) rotate(72)" filter="url(#glow)"/><path d="M0,0 C-70,-60 -78,-170 0,-235 C78,-170 70,-60 0,0 Z" fill="url(#p2)" stroke="#efe4c6" stroke-opacity=".8" stroke-width="2" transform="translate(500,330) rotate(144)" filter="url(#glow)"/><path d="M0,0 C-70,-60 -78,-170 0,-235 C78,-170 70,-60 0,0 Z" fill="url(#p3)" stroke="#7fe6d8" stroke-opacity=".8" stroke-width="2" transform="translate(500,330) rotate(216)" filter="url(#glow)"/><path d="M0,0 C-70,-60 -78,-170 0,-235 C78,-170 70,-60 0,0 Z" fill="url(#p4)" stroke="#ffffff" stroke-opacity=".8" stroke-width="2" transform="translate(500,330) rotate(288)" filter="url(#glow)"/>
  <path d="M0,0 C-30,-30 -32,-85 0,-115 C32,-85 30,-30 0,0 Z" fill="#fff6fb" fill-opacity=".35" transform="translate(500,330) rotate(36)"/><path d="M0,0 C-30,-30 -32,-85 0,-115 C32,-85 30,-30 0,0 Z" fill="#fff6fb" fill-opacity=".35" transform="translate(500,330) rotate(108)"/><path d="M0,0 C-30,-30 -32,-85 0,-115 C32,-85 30,-30 0,0 Z" fill="#fff6fb" fill-opacity=".35" transform="translate(500,330) rotate(180)"/><path d="M0,0 C-30,-30 -32,-85 0,-115 C32,-85 30,-30 0,0 Z" fill="#fff6fb" fill-opacity=".35" transform="translate(500,330) rotate(252)"/><path d="M0,0 C-30,-30 -32,-85 0,-115 C32,-85 30,-30 0,0 Z" fill="#fff6fb" fill-opacity=".35" transform="translate(500,330) rotate(324)"/>
  <circle cx="500" cy="330" r="70" fill="url(#core)"/>
  <circle cx="500" cy="330" r="16" fill="#ffffff"/>
</svg>
