<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660">
  <!-- 밤하늘에 뚫린 시간의 균열. three-futures-theme.css의 .sky-rift가 사용 -->
  <defs>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#cfe0ff" stop-opacity=".55"/>
      <stop offset=".35" stop-color="#7fb2ff" stop-opacity=".22"/>
      <stop offset=".7" stop-color="#e4c673" stop-opacity=".06"/>
